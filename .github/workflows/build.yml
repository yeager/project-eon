name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI is deliberately read-only. Project Eon releases are created only when the
# maintainer explicitly requests one; this workflow cannot tag or publish.
permissions:
  contents: read

# Main receives frequent small, self-contained preservation updates.  Superseded
# platform matrices add no signal and can otherwise keep the current revision
# waiting behind obsolete runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every source-built CI dependency is fetched by immutable Git object ID.
# Each object ID resolves to the respective upstream release tag: SDL
# release-3.4.14, zlib v1.3.1, and libpng v1.6.50.  Do not replace them with
# branch names or tag names: upstream refs are mutable.
env:
  SDL3_REF: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
  ZLIB_REF: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
  LIBPNG_REF: 2b978915d82377df13fcbb1fb56660195ded868a

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v6.1.0; pin the action itself as well as source-built dependencies.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gettext zlib1g-dev libpng-dev libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git init SDL3-src
          git -C SDL3-src remote add origin https://github.com/libsdl-org/SDL.git
          git -C SDL3-src fetch --depth 1 --filter=blob:none origin "$SDL3_REF"
          git -C SDL3-src checkout --detach FETCH_HEAD
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr/local \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Build Project Eon
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
          ninja -C build l10n
      - name: Test native code without proprietary game data
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Install preservation analysis dependencies
        run: python3 -m pip install --user --requirement requirements-analysis.txt
      - name: Test preservation tooling
        run: python3 -m unittest discover -s tests -v
      - name: Verify preservation ledger
        run: python3 tools/verify_preservation_ledger.py

  build-macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dependencies
        run: brew install cmake ninja sdl3 zlib libpng
      - name: Build Project Eon
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Test native code without proprietary game data
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Install preservation analysis dependencies
        # Homebrew Python on the macOS runner marks its base environment as
        # externally managed (PEP 668). These are CI-only analysis tools;
        # permit this one isolated --user installation rather than failing
        # before the preservation tests start.
        run: python3 -m pip install --user --break-system-packages --requirement requirements-analysis.txt
      - name: Test preservation tooling
        run: python3 -m unittest discover -s tests -v
      - name: Verify preservation ledger
        run: python3 tools/verify_preservation_ledger.py

  build-windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build zlib
        shell: pwsh
        run: |
          git init zlib-src
          git -C zlib-src remote add origin https://github.com/madler/zlib.git
          git -C zlib-src fetch --depth 1 origin $env:ZLIB_REF
          git -C zlib-src checkout --detach FETCH_HEAD
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/zlib-install"
          cmake --build zlib-build --config Release --parallel 2
          cmake --install zlib-build --config Release
      - name: Build libpng for SDL3_image
        shell: pwsh
        run: |
          git init libpng-src
          git -C libpng-src remote add origin https://github.com/pnggroup/libpng.git
          git -C libpng-src fetch --depth 1 origin $env:LIBPNG_REF
          git -C libpng-src checkout --detach FETCH_HEAD
          cmake -S libpng-src -B libpng-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/libpng-install" -DPNG_SHARED=ON -DPNG_STATIC=OFF -DZLIB_ROOT="${{ github.workspace }}/zlib-install"
          cmake --build libpng-build --config Release --parallel 2
          cmake --install libpng-build --config Release
      - name: Build SDL3
        shell: pwsh
        run: |
          git init SDL3-src
          git -C SDL3-src remote add origin https://github.com/libsdl-org/SDL.git
          git -C SDL3-src fetch --depth 1 --filter=blob:none origin $env:SDL3_REF
          git -C SDL3-src checkout --detach FETCH_HEAD
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/SDL3-install" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build SDL3-build --config Release --parallel 2
          cmake --install SDL3-build --config Release
      - name: Build Project Eon
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-install;${{ github.workspace }}/libpng-install;${{ github.workspace }}/zlib-install"
          cmake --build build --config Release --parallel 2
      - name: Test native code without proprietary game data
        shell: pwsh
        run: |
          # CTest launches the test binary from its build directory.  The
          # SDL3_ttf and SDL3_image DLLs fetched by CMake live below that
          # tree, not beside the separately installed SDL3 SDK.  Add every
          # generated DLL directory so Windows performs the same dynamic-load
          # closure as the staged installer, instead of failing with
          # STATUS_DLL_NOT_FOUND before the preservation tests start.
          $generatedRuntimeDirectories = @(Get-ChildItem -Path build -Recurse -File -Filter *.dll |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($generatedRuntimeDirectories.Count -eq 0) {
            throw "CMake build produced no runtime DLL directories"
          }
          $env:PATH = (($generatedRuntimeDirectories + @(
            "${{ github.workspace }}/SDL3-install/bin",
            "${{ github.workspace }}/libpng-install/bin",
            "${{ github.workspace }}/zlib-install/bin",
            $env:PATH)) -join ';')
          ctest --test-dir build -C Release -j4 --output-on-failure
      - name: Install preservation analysis dependencies
        shell: pwsh
        run: python -m pip install --user --requirement requirements-analysis.txt
      - name: Test preservation tooling
        run: python -m unittest discover -s tests -v
      - name: Verify preservation ledger
        run: python tools/verify_preservation_ledger.py

  package-linux:
    name: Linux packages
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf rpm cpio desktop-file-utils lintian rpmlint zlib1g-dev libpng-dev libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git init SDL3-src
          git -C SDL3-src remote add origin https://github.com/libsdl-org/SDL.git
          git -C SDL3-src fetch --depth 1 --filter=blob:none origin "$SDL3_REF"
          git -C SDL3-src checkout --detach FETCH_HEAD
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Fetch pinned AppImage build tools
        run: |
          mkdir -p package/appimage-tools
          curl --fail --location --retry 3 --output package/appimage-tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  package/appimage-tools/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod 0755 package/appimage-tools/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 --output package/appimage-tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  package/appimage-tools/runtime-x86_64" | sha256sum --check --strict
      - name: Build distributable packages without game media
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
          cpack --config build/CPackConfig.cmake -G DEB -B package/deb
          cpack --config build/CPackConfig.cmake -G RPM -B package/rpm
          mkdir -p package/appimage
          bash packaging/appimage/build-appimage.sh \
            --build-dir "$PWD/build" \
            --output "$PWD/package/appimage/Project-Eon-x86_64.AppImage" \
            --appimagetool "$PWD/package/appimage-tools/appimagetool-x86_64.AppImage" \
            --runtime-file "$PWD/package/appimage-tools/runtime-x86_64" \
            --architecture x86_64
      - name: Verify package contents contain no game media
        run: bash packaging/verify-desktop-package.sh package/deb/*.deb package/rpm/*.rpm
      - name: Verify AppImage contents contain no game media
        run: >-
          EON_PACKAGE_TEST_TMPDIR="$HOME/.cache/project-eon-tools/package-validation"
          bash packaging/appimage/verify-appimage.sh
          "$PWD/package/appimage/Project-Eon-x86_64.AppImage"
      - name: Enforce Debian mentors and RPM package policy
        run: bash packaging/verify-distribution-policy.sh package/deb/*.deb package/rpm/*.rpm
      - name: Write artifact integrity manifest
        run: >-
          python3 packaging/write-artifact-manifest.py
          --source-revision "$GITHUB_SHA"
          --output package/project-eon-linux-artifacts.json
          package/deb/*.deb package/rpm/*.rpm package/appimage/*.AppImage
          && mkdir artifact-upload
          && cp package/deb/*.deb package/rpm/*.rpm package/appimage/*.AppImage package/project-eon-linux-artifacts.json artifact-upload/
      - name: Verify artifact integrity manifest
        run: >-
          python3 packaging/verify-artifact-manifest.py
          --manifest artifact-upload/project-eon-linux-artifacts.json
          --directory artifact-upload
          --expected-source-revision "$GITHUB_SHA"
          --require-exact-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-x86_64
          path: artifact-upload/

  package-macos:
    name: macOS app (${{ matrix.arch }})
    needs: build-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dependencies
        run: brew install cmake ninja sdl3 zlib libpng
      - name: Build native application bundle
        run: |
          # Configure the selected target explicitly. A future runner-image
          # migration must not produce a host-default Mach-O under the wrong
          # architecture artifact name.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          ninja -C build
          APP=ProjectEon.app
          mkdir -p "$APP/Contents/MacOS/assets/cards" "$APP/Contents/MacOS/assets/branding" "$APP/Contents/Resources/po"
          mkdir -p "$APP/Contents/Frameworks"
          cp build/project-eon "$APP/Contents/MacOS/ProjectEon"
          cp assets/cards/*.png "$APP/Contents/MacOS/assets/cards/"
          cp assets/branding/project-eon-logo-v1.png "$APP/Contents/MacOS/assets/branding/"
          cp assets/branding/project-eon.icns "$APP/Contents/Resources/project-eon.icns"
          cp -R assets/fonts "$APP/Contents/MacOS/assets/fonts"
          cp po/*.po "$APP/Contents/Resources/po/"
          cp README.md LICENSE "$APP/Contents/Resources/"
          # The artifact name is architecture-specific. Do not rely on the
          # runner label alone: a host/default-architecture CMake regression
          # must not publish an Intel binary as arm64 (or vice versa).
          built_architectures=$(lipo -archs "$APP/Contents/MacOS/ProjectEon")
          if [ "$built_architectures" != "${{ matrix.arch }}" ]; then
            echo "macOS bundle architecture mismatch: expected ${{ matrix.arch }}, got $built_architectures" >&2
            exit 1
          fi
          rpaths_for() {
            otool -l "$1" | sed -n 's/^[[:space:]]*path \(.*\) (offset [0-9][0-9]*)$/\1/p'
          }
          resolve_rpath_reference() {
            local binary="$1"
            local reference="$2"
            local suffix="${reference#@rpath/}"
            local rpath candidate
            while IFS= read -r rpath; do
              case "$rpath" in
                @loader_path/*)
                  candidate="$(dirname "$binary")/${rpath#@loader_path/}/$suffix"
                  ;;
                @executable_path/*)
                  candidate="$APP/Contents/MacOS/${rpath#@executable_path/}/$suffix"
                  ;;
                /*)
                  candidate="$rpath/$suffix"
                  ;;
                *)
                  echo "unsupported LC_RPATH '$rpath' while resolving $reference" >&2
                  exit 1
                  ;;
              esac
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(rpaths_for "$binary")
            # SDL_image built from source can retain an @rpath reference to
            # Homebrew's SDL3 even when its own build-tree rpath is absent.
            # Resolve that known, reviewed build dependency here only so it is
            # copied and rewritten into the bundle below; the final verifier
            # still rejects any Homebrew reference in the artifact.
            if brew_prefix=$(brew --prefix sdl3 2>/dev/null) \
                && [ -f "$brew_prefix/lib/$suffix" ]; then
              printf '%s\n' "$brew_prefix/lib/$suffix"
              return 0
            fi
            echo "unable to resolve $reference referenced by $binary" >&2
            return 1
          }
          resolve_loader_reference() {
            local binary="$1"
            local reference="$2"
            printf '%s/%s\n' "$(dirname "$binary")" "${reference#@loader_path/}"
          }
          bundle_dylib() {
            local binary="$1"
            # Resolve dependencies relative to the unmodified source object,
            # then rewrite only the in-bundle copy.  This matters for a
            # dependency that was expressed through @loader_path by Homebrew.
            local source_binary="${2:-$1}"
            # `otool -L` prints a dylib's own install name as its first
            # dependency-looking row.  It is not a load dependency; trying to
            # resolve it recursively made the bundle step reject SDL3_image
            # while looking for the library it was already copying.
            local own_install_name
            own_install_name=$(otool -D "$source_binary" 2>/dev/null | sed -n '2p' || true)
            otool -L "$source_binary" | awk 'NR>1{print $1}' | while read -r ref; do
              if [ -n "$own_install_name" ] && [ "$ref" = "$own_install_name" ]; then
                continue
              fi
              local install_name="$ref"
              case "$ref" in
                /usr/lib/*|/System/*|@executable_path/*) continue ;;
                @loader_path/*) ref=$(resolve_loader_reference "$source_binary" "$ref") ;;
                @rpath/*) ref=$(resolve_rpath_reference "$source_binary" "$ref") ;;
              esac
              test -f "$ref" || { echo "missing dynamic library $ref referenced by $source_binary" >&2; exit 1; }
              local name=$(basename "$ref")
              local dest="$APP/Contents/Frameworks/$name"
              if [ ! -f "$dest" ]; then
                cp "$ref" "$dest"
                chmod 644 "$dest"
                install_name_tool -id "@executable_path/../Frameworks/$name" "$dest"
                bundle_dylib "$dest" "$ref"
              fi
              install_name_tool -change "$install_name" "@executable_path/../Frameworks/$name" "$binary"
            done
          }
          bundle_dylib "$APP/Contents/MacOS/ProjectEon"
          for framework in "$APP/Contents/Frameworks/"*.dylib; do
            test -e "$framework" && bundle_dylib "$framework"
          done
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>ProjectEon</string><key>CFBundleIdentifier</key><string>com.yeager.projecteon</string><key>CFBundleName</key><string>Project Eon</string><key>CFBundleIconFile</key><string>project-eon.icns</string><key>CFBundleVersion</key><string>0.1.0</string></dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          # This checks every Mach-O object in the completed bundle, including
          # dependencies expressed through LC_RPATH.  It rejects an artifact
          # that would load from Homebrew or any other developer-machine path.
          bash packaging/macos/verify-dylib-closure.sh "$APP"
          # Check the assembled bundle before zipping it. Source-tree asset
          # fallbacks are not available to an installed application.
          for required in \
            "$APP/Contents/MacOS/assets/cards/millennium.png" \
            "$APP/Contents/MacOS/assets/cards/deuteros.png" \
            "$APP/Contents/MacOS/assets/cards/dos-platform-v1.png" \
            "$APP/Contents/MacOS/assets/cards/amiga-platform-v1.png" \
            "$APP/Contents/MacOS/assets/cards/atari-st-platform-v1.png" \
            "$APP/Contents/MacOS/assets/cards/original-profile-v1.png" \
            "$APP/Contents/MacOS/assets/cards/modern-profile-v1.png" \
            "$APP/Contents/MacOS/assets/cards/custom-profile-v1.png" \
            "$APP/Contents/MacOS/assets/branding/project-eon-logo-v1.png" \
            "$APP/Contents/Resources/project-eon.icns"; do
            test -f "$required"
          done
          for font in NotoSans-Regular.ttf NotoSansArabic-Regular.ttf \
              NotoSansDevanagari-Regular.ttf NotoSansJP-Regular.otf \
              NotoSansKR-Regular.otf NotoSansSC-Regular.otf OFL-1.1.txt; do
            test -f "$APP/Contents/MacOS/assets/fonts/$font"
          done
          for catalog in ar de el en_GB es fi fr hi it ja ko nl no pl pt_BR ru sv tr uk zh_CN; do
            test -f "$APP/Contents/Resources/po/$catalog.po"
          done
          if find "$APP" -type d -name data -print -quit | grep -q . \
              || find "$APP" -type f \( -iname '*.zip' -o -iname '*.adf' -o -iname '*.adz' \
                  -o -iname '*.dms' -o -iname '*.st' -o -iname '*.msa' -o -iname '*.stx' \
                  -o -iname '*.img' -o -iname '*.hfe' -o -iname '*.ipf' -o -iname '*.scp' \
                  -o -iname '*.ctr' -o -iname '*.lha' -o -iname '*.lzh' -o -iname '*.lzx' \
                  -o -iname '*.exe' -o -iname '*.com' \) -print -quit | grep -q .; then
            echo "refusing macOS artifact with possible original game data" >&2
            exit 1
          fi
          # Exercise the assembled application bundle, not the build-tree
          # executable, with the same missing-default-data contract verified
          # for Linux and the installed Windows artifact. The isolated home
          # stays below Eon's scoped cache and is removed after this package
          # step; the application must neither create ~/.projecteon nor need
          # any original game data merely to report that it is absent.
          package_cache="$HOME/.cache/project-eon-tools/macos-package-validation"
          mkdir -p "$package_cache"
          test ! -L "$package_cache"
          isolated_home=$(mktemp -d "$package_cache/eon-macos-package.XXXXXXXX")
          trap 'rm -rf -- "$isolated_home"' EXIT
          if inspect_output=$(HOME="$isolated_home" "$APP/Contents/MacOS/ProjectEon" --inspect 2>&1); then
            echo "macOS bundle unexpectedly inspected missing default game data" >&2
            exit 1
          fi
          if ! printf '%s\n' "$inspect_output" | grep -Fq "Data path does not exist: \"$isolated_home/.projecteon\""; then
            echo "macOS bundle did not report its isolated missing default game-data path" >&2
            exit 1
          fi
          if [ -e "$isolated_home/.projecteon" ]; then
            echo "macOS bundle created its default game-data directory during lookup" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "project-eon-macos-${{ matrix.arch }}.zip"
          unzip -t "project-eon-macos-${{ matrix.arch }}.zip" >/dev/null
          listing=$(unzip -Z1 "project-eon-macos-${{ matrix.arch }}.zip")
          for required in \
            "ProjectEon.app/Contents/MacOS/assets/cards/millennium.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/deuteros.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/dos-platform-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/amiga-platform-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/atari-st-platform-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/original-profile-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/modern-profile-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/cards/custom-profile-v1.png" \
            "ProjectEon.app/Contents/MacOS/assets/branding/project-eon-logo-v1.png" \
            "ProjectEon.app/Contents/Resources/project-eon.icns"; do
            printf '%s\n' "$listing" | grep -Fxq "$required"
          done
          for font in NotoSans-Regular.ttf NotoSansArabic-Regular.ttf \
              NotoSansDevanagari-Regular.ttf NotoSansJP-Regular.otf \
              NotoSansKR-Regular.otf NotoSansSC-Regular.otf OFL-1.1.txt; do
            printf '%s\n' "$listing" | grep -Fxq "ProjectEon.app/Contents/MacOS/assets/fonts/$font"
          done
          for catalog in ar de el en_GB es fi fr hi it ja ko nl no pl pt_BR ru sv tr uk zh_CN; do
            printf '%s\n' "$listing" | grep -Fxq "ProjectEon.app/Contents/Resources/po/$catalog.po"
          done
      - name: Write artifact integrity manifest
        run: >-
          python3 packaging/write-artifact-manifest.py
          --source-revision "$GITHUB_SHA"
          --output project-eon-macos-${{ matrix.arch }}-artifacts.json
          project-eon-macos-${{ matrix.arch }}.zip
          && mkdir artifact-upload
          && cp project-eon-macos-${{ matrix.arch }}.zip project-eon-macos-${{ matrix.arch }}-artifacts.json artifact-upload/
      - name: Verify artifact integrity manifest
        run: >-
          python3 packaging/verify-artifact-manifest.py
          --manifest artifact-upload/project-eon-macos-${{ matrix.arch }}-artifacts.json
          --directory artifact-upload
          --expected-source-revision "$GITHUB_SHA"
          --require-exact-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-app
          path: artifact-upload/

  package-windows:
    name: Windows Inno Setup
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build zlib and SDL3
        shell: pwsh
        run: |
          git init zlib-src
          git -C zlib-src remote add origin https://github.com/madler/zlib.git
          git -C zlib-src fetch --depth 1 origin $env:ZLIB_REF
          git -C zlib-src checkout --detach FETCH_HEAD
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/zlib-install"
          cmake --build zlib-build --config Release --parallel 2
          cmake --install zlib-build --config Release
          git init libpng-src
          git -C libpng-src remote add origin https://github.com/pnggroup/libpng.git
          git -C libpng-src fetch --depth 1 origin $env:LIBPNG_REF
          git -C libpng-src checkout --detach FETCH_HEAD
          cmake -S libpng-src -B libpng-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/libpng-install" -DPNG_SHARED=ON -DPNG_STATIC=OFF -DZLIB_ROOT="${{ github.workspace }}/zlib-install"
          cmake --build libpng-build --config Release --parallel 2
          cmake --install libpng-build --config Release
          git init SDL3-src
          git -C SDL3-src remote add origin https://github.com/libsdl-org/SDL.git
          git -C SDL3-src fetch --depth 1 --filter=blob:none origin $env:SDL3_REF
          git -C SDL3-src checkout --detach FETCH_HEAD
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/SDL3-install" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build SDL3-build --config Release --parallel 2
          cmake --install SDL3-build --config Release
      - name: Build and stage Project Eon only
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-install;${{ github.workspace }}/libpng-install;${{ github.workspace }}/zlib-install"
          cmake --build build --config Release --parallel 2
          New-Item -ItemType Directory -Force dist/assets/cards,dist/assets/branding,dist/po | Out-Null
          Copy-Item build/Release/project-eon.exe dist/project-eon.exe
          Copy-Item "${{ github.workspace }}/SDL3-install/bin/SDL3.dll" dist/SDL3.dll
          $sdlImage = Get-ChildItem build -Recurse -Filter SDL3_image.dll | Select-Object -First 1
          if ($null -eq $sdlImage) { throw "SDL3_image.dll was not produced" }
          Copy-Item $sdlImage.FullName dist/SDL3_image.dll
          $sdlTtf = Get-ChildItem build -Recurse -Filter SDL3_ttf.dll | Select-Object -First 1
          if ($null -eq $sdlTtf) { throw "SDL3_ttf.dll was not produced" }
          Copy-Item $sdlTtf.FullName dist/SDL3_ttf.dll
          Get-ChildItem "${{ github.workspace }}/libpng-install/bin/libpng*.dll" | Copy-Item -Destination dist
          Get-ChildItem "${{ github.workspace }}/zlib-install/bin/zlib*.dll" | Copy-Item -Destination dist
          Copy-Item assets/cards/*.png dist/assets/cards/
          Copy-Item assets/branding/* dist/assets/branding/
          Copy-Item assets/fonts dist/assets/fonts -Recurse
          Copy-Item po/*.po dist/po/
          Copy-Item README.md,LICENSE dist/
          # Validate the exact staging tree supplied to Inno Setup. In
          # particular, SDL3_image is linked against the shared libpng built
          # above, so that DLL must reach the installer as well.
          $required = @("project-eon.exe", "SDL3.dll", "SDL3_image.dll", "SDL3_ttf.dll", "assets/cards/millennium.png", "assets/cards/deuteros.png", "assets/cards/dos-platform-v1.png", "assets/cards/amiga-platform-v1.png", "assets/cards/atari-st-platform-v1.png", "assets/cards/original-profile-v1.png", "assets/cards/modern-profile-v1.png", "assets/cards/custom-profile-v1.png", "assets/branding/project-eon-logo-v1.png", "assets/branding/project-eon.ico", "assets/branding/project-eon.icns", "assets/branding/README.md")
          $fonts = @("NotoSans-Regular.ttf", "NotoSansArabic-Regular.ttf", "NotoSansDevanagari-Regular.ttf", "NotoSansJP-Regular.otf", "NotoSansKR-Regular.otf", "NotoSansSC-Regular.otf", "OFL-1.1.txt")
          foreach ($font in $fonts) { $required += "assets/fonts/$font" }
          $catalogs = @("ar", "de", "el", "en_GB", "es", "fi", "fr", "hi", "it", "ja", "ko", "nl", "no", "pl", "pt_BR", "ru", "sv", "tr", "uk", "zh_CN")
          foreach ($catalog in $catalogs) { $required += "po/$catalog.po" }
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path dist $path))) {
              throw "Windows package stage lacks required resource: $path"
            }
          }
          # Inno recursively packages assets and PO files. Presence checks are
          # not sufficient: reject an extra staged file so a stale workspace
          # artifact or an unreviewed asset cannot hitch a ride in the final
          # installer even if it is not recognised as game media.
          $approved = @("project-eon.exe", "SDL3.dll", "SDL3_image.dll", "SDL3_ttf.dll", "README.md", "LICENSE") + $required
          $unexpected = Get-ChildItem dist -Recurse -File | Where-Object {
            $relative = $_.FullName.Substring((Resolve-Path dist).Path.Length).TrimStart('\', '/')
            $relative -notin $approved -and $relative -notmatch '^(libpng|zlib).+\.dll$'
          }
          if ($unexpected) {
            throw "Windows package stage contains unexpected file(s): $($unexpected.FullName -join ', ')"
          }
          if (-not (Get-ChildItem dist -Filter "libpng*.dll" -File | Select-Object -First 1)) {
            throw "Windows package stage lacks libpng runtime DLL"
          }
          if (-not (Get-ChildItem dist -Filter "zlib*.dll" -File | Select-Object -First 1)) {
            throw "Windows package stage lacks zlib runtime DLL"
          }
          $media = Get-ChildItem dist -Recurse -File | Where-Object {
            $_.Extension -match '^(?i:\.(zip|adf|adz|dms|st|msa|stx|img|hfe|ipf|scp|ctr|lha|lzh|lzx|exe|com))$' -and $_.Name -ne "project-eon.exe"
          }
          if ($media) {
            throw "refusing Windows package stage with possible original game data: $($media.FullName -join ', ')"
          }
      - name: Create Inno Setup installer
        shell: pwsh
        run: iscc "/DMyAppVersion=0.1.0-ci.${{ github.run_number }}" packaging/windows/project-eon.iss
      - name: Verify installed Inno Setup package and runtime closure
        shell: pwsh
        run: |
          # Check the installer itself, not merely its source staging tree.
          # A unique temporary destination avoids sharing state with a prior
          # runner job and deliberately contains no original game media.
          $installers = @(Get-ChildItem installer -Filter "Project-Eon-*-windows-x64.exe" -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one generated Windows installer, found $($installers.Count)"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP ("project-eon-inno-" + [guid]::NewGuid().ToString("N"))
          & $installers[0].FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installer failed with exit status $LASTEXITCODE"
          }

          # Inno must preserve every staged Project Eon file byte-for-byte.
          # The uninstaller is intentionally extra, but no staged file may be
          # absent, renamed, or changed during the installer round trip.
          foreach ($source in Get-ChildItem dist -Recurse -File) {
            $relative = $source.FullName.Substring((Resolve-Path dist).Path.Length).TrimStart('\', '/')
            $installed = Join-Path $installRoot $relative
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
              throw "installed package lacks staged file: $relative"
            }
            if ((Get-FileHash -Algorithm SHA256 $source).Hash -ne
                (Get-FileHash -Algorithm SHA256 $installed).Hash) {
              throw "installed package changed staged file: $relative"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $installRoot "data")) {
            throw "installed package must not create a game-data directory"
          }
          $media = Get-ChildItem $installRoot -Recurse -File | Where-Object {
            $_.Extension -match '^(?i:\.(zip|adf|adz|dms|st|msa|stx|img|hfe|ipf|scp|ctr|lha|lzh|lzx|exe|com))$' -and
              $_.Name -ne "project-eon.exe" -and $_.Name -notlike "unins*.exe"
          }
          if ($media) {
            throw "installed package contains possible original game media: $($media.FullName -join ', ')"
          }

          # Exercise the installed executable's actual Windows default-data
          # lookup. Unlike --help, --inspect reaches the scanner boundary and
          # must name <install-dir>\data without creating it or falling back
          # to HOME/.projecteon.
          $installedExecutable = Join-Path $installRoot "project-eon.exe"
          $inspect = & $installedExecutable --inspect 2>&1 | Out-String
          $expectedDataPath = Join-Path $installRoot "data"
          if ($LASTEXITCODE -ne 2 -or
              $inspect -notmatch [regex]::Escape("Data path does not exist: `"$expectedDataPath`"")) {
            throw "installed Project Eon executable did not retain its Windows default data boundary: $inspect"
          }
          if (Test-Path -LiteralPath $expectedDataPath) {
            throw "installed Project Eon executable created its default game-data directory during lookup"
          }

          # --help returns before SDL initialization or any data scan.  It is
          # a real Windows loader smoke test for the executable and all of its
          # packaged DLL dependencies, without supplying synthetic game data.
          $usage = & $installedExecutable --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $usage -notmatch "Without --data/--data-dir") {
            throw "installed Project Eon executable did not load and print its CLI usage: $usage"
          }
      - name: Write artifact integrity manifest
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem installer -Filter "Project-Eon-*-windows-x64.exe" -File)
          if ($installer.Count -ne 1) {
            throw "expected exactly one generated Windows installer for integrity manifest"
          }
          python packaging/write-artifact-manifest.py `
            --source-revision "$env:GITHUB_SHA" `
            --output installer/project-eon-windows-artifacts.json `
            $installer[0].FullName
          New-Item -ItemType Directory -Path artifact-upload | Out-Null
          Copy-Item $installer[0].FullName, installer/project-eon-windows-artifacts.json artifact-upload/
      - name: Verify artifact integrity manifest
        shell: pwsh
        run: |
          python packaging/verify-artifact-manifest.py `
            --manifest artifact-upload/project-eon-windows-artifacts.json `
            --directory artifact-upload `
            --expected-source-revision "$env:GITHUB_SHA" `
            --require-exact-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-installer
          path: artifact-upload/

  package-ipados:
    name: iPadOS sideload IPA
    needs: build-macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build arm64 SDL3 and Project Eon iPad application
        run: |
          brew install cmake ninja
          IOS_ARGS="-G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release"
          IOS_PREFIX="${{ github.workspace }}/ios-deps"
          git init zlib-src
          git -C zlib-src remote add origin https://github.com/madler/zlib.git
          git -C zlib-src fetch --depth 1 origin "$ZLIB_REF"
          git -C zlib-src checkout --detach FETCH_HEAD
          cmake -S zlib-src -B zlib-build $IOS_ARGS -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX"
          cmake --build zlib-build --config Release --target install
          git init libpng-src
          git -C libpng-src remote add origin https://github.com/pnggroup/libpng.git
          git -C libpng-src fetch --depth 1 origin "$LIBPNG_REF"
          git -C libpng-src checkout --detach FETCH_HEAD
          cmake -S libpng-src -B libpng-build $IOS_ARGS -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DZLIB_ROOT="$IOS_PREFIX" -DPNG_SHARED=OFF -DPNG_STATIC=ON
          cmake --build libpng-build --config Release --target install
          git init SDL3-src
          git -C SDL3-src remote add origin https://github.com/libsdl-org/SDL.git
          git -C SDL3-src fetch --depth 1 --filter=blob:none origin "$SDL3_REF"
          git -C SDL3-src checkout --detach FETCH_HEAD
          cmake -S SDL3-src -B SDL3-build $IOS_ARGS \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" -DCMAKE_PREFIX_PATH="$IOS_PREFIX"
          cmake --build SDL3-build --config Release --target install
          cmake -S . -B build-ios $IOS_ARGS \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$IOS_PREFIX" \
            -DSDL3_DIR="$IOS_PREFIX/lib/cmake/SDL3"
          cmake --build build-ios --config Release --target project-eon
      - name: Create unsigned sideload IPA without game media
        run: |
          APP=$(find build-ios -name 'project-eon.app' -type d -print -quit)
          test -n "$APP"
          # Ninja's iOS bundle generator does not consistently materialize
          # MACOSX_PACKAGE_LOCATION resources from target sources. Stage the
          # same reviewed launcher-only resources explicitly into the final
          # app bundle before the IPA safety check. No original game data is
          # selected, copied, or created here.
          mkdir -p "$APP/Resources/assets/cards" "$APP/Resources/assets/branding" "$APP/Resources/assets/fonts" "$APP/Resources/po"
          cp assets/cards/*.png "$APP/Resources/assets/cards/"
          cp assets/branding/project-eon-logo-v1.png "$APP/Resources/assets/branding/"
          cp assets/fonts/NotoSans-Regular.ttf assets/fonts/NotoSansArabic-Regular.ttf \
            assets/fonts/NotoSansDevanagari-Regular.ttf assets/fonts/NotoSansJP-Regular.otf \
            assets/fonts/NotoSansKR-Regular.otf assets/fonts/NotoSansSC-Regular.otf \
            assets/fonts/OFL-1.1.txt "$APP/Resources/assets/fonts/"
          cp po/{ar,de,el,en_GB,es,fi,fr,hi,it,ja,ko,nl,no,pl,pt_BR,ru,sv,tr,uk,zh_CN}.po "$APP/Resources/po/"
          bash packaging/ios/package-ipa.sh "$APP" "$GITHUB_WORKSPACE/project-eon-ipados-arm64-unsigned.ipa"
          # Validate the finished archive, not only the app bundle passed to
          # the packager, before it can enter the artifact manifest/upload.
          python3 packaging/ios/verify-ipa.py "$GITHUB_WORKSPACE/project-eon-ipados-arm64-unsigned.ipa"
      - name: Write artifact integrity manifest
        run: >-
          python3 packaging/write-artifact-manifest.py
          --source-revision "$GITHUB_SHA"
          --output project-eon-ipados-arm64-unsigned-artifacts.json
          project-eon-ipados-arm64-unsigned.ipa
          && mkdir artifact-upload
          && cp project-eon-ipados-arm64-unsigned.ipa project-eon-ipados-arm64-unsigned-artifacts.json artifact-upload/
      - name: Verify artifact integrity manifest
        run: >-
          python3 packaging/verify-artifact-manifest.py
          --manifest artifact-upload/project-eon-ipados-arm64-unsigned-artifacts.json
          --directory artifact-upload
          --expected-source-revision "$GITHUB_SHA"
          --require-exact-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipados-arm64-unsigned-ipa
          path: artifact-upload/
