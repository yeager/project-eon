name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI is deliberately read-only. Project Eon releases are created only when the
# maintainer explicitly requests one; this workflow cannot tag or publish.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libpng-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr/local \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Build Project Eon
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Test native code without proprietary game data
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Test preservation tooling
        run: python3 -m unittest discover -s tests -v

  build-macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake ninja sdl3 zlib libpng
      - name: Build Project Eon
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Test native code without proprietary game data
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Test preservation tooling
        run: python3 -m unittest discover -s tests -v

  build-windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build zlib
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/zlib-install"
          cmake --build zlib-build --config Release --parallel 2
          cmake --install zlib-build --config Release
      - name: Build SDL3
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/SDL3-install" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build SDL3-build --config Release --parallel 2
          cmake --install SDL3-build --config Release
      - name: Build Project Eon
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-install;${{ github.workspace }}/zlib-install"
          cmake --build build --config Release --parallel 2
      - name: Test native code without proprietary game data
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/SDL3-install/bin;${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure
      - name: Test preservation tooling
        run: python -m unittest discover -s tests -v
