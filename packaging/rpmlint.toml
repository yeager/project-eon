# Project Eon CI builds non-release RPM artifacts. Releases are maintainer-only,
# so manufacturing a CI signing identity would misrepresent their provenance.
# CPack also provides truthful Vendor and Contact metadata but cannot emit the
# redundant Packager header. Ubuntu 24.04's rpmlint 2.5 license table predates
# RPM's accepted SPDX spelling of MIT.
Filters = [
  "no-signature$",
  "no-packager-tag$",
  "invalid-license MIT$",
]

# Project Eon deliberately uses the broadly supported .gz convention for
# manual pages (and Debian requires that same staged file). rpmlint's generic
# upstream configuration defaults to bz2 without detecting the package's
# actual distribution policy, so declare the package convention explicitly.
# This is a format selection, not a diagnostic suppression; the policy script
# independently verifies the member name and gzip stream before rpmlint runs.
CompressExtension = "gz"
